# Composite action so a consumer's workflow is three lines instead of the
# five hand-assembled steps the README used to ask people to copy.
name: "diffmind code review"
description: "Local-first AI code review. No API keys, no data leaves the runner."
branding:
  icon: "eye"
  color: "purple"

inputs:
  version:
    description: "diffmind release tag to install, or 'latest'."
    required: false
    default: "latest"
  model:
    description: "Model size: 0.5b, 1.5b, 3b, 7b, 14b, 32b."
    required: false
    default: "1.5b"
  base:
    description: "Base ref to diff against. Defaults to the PR's base branch."
    required: false
    default: ""
  min-severity:
    description: "Minimum severity to report: low, medium, high."
    required: false
    default: "low"
  fail-on:
    description: "Severity that fails the job. Set to 'none' to never fail."
    required: false
    default: "high"
  format:
    description: "text, json, sarif, or markdown."
    required: false
    default: "sarif"
  output:
    description: "File to write the report to."
    required: false
    default: "diffmind.sarif"
  upload-sarif:
    description: "Upload SARIF to GitHub Code Scanning for inline PR annotations."
    required: false
    default: "true"
  comment:
    description: "Post the review as a PR comment (requires format markdown)."
    required: false
    default: "false"
  ticket:
    description: "Acceptance criteria to check the diff against (path or text)."
    required: false
    default: ""
  args:
    description: >-
      Extra flags passed through to diffmind. Split like a shell would split a
      quoted string, but never evaluated by one: no variable expansion, command
      substitution or globbing.
    required: false
    default: ""
  config-from:
    description: >-
      Which revision's .diffmind/ configuration (config.toml, rules.toml,
      rules/, baseline.json) a pull request is reviewed under. "base" (the
      default) uses the merge base, so a PR cannot relax the gate that reviews
      it through those files; changes to them are still reviewed and take
      effect once merged. "head" uses the PR's own files. On events with no
      base branch (merge_group, push), the checkout's own files are used
      unless the `base` input is set.
    required: false
    default: "base"
  allow-incomplete:
    description: >-
      Let the job pass when part of the diff could not be reviewed (a unit the
      model's output could not be parsed for, or one too large for the context
      window). Off by default: an incomplete review is reported as a failure
      (exit 2) rather than as a clean result.
    required: false
    default: "false"

outputs:
  findings:
    description: "Number of findings reported."
    value: ${{ steps.review.outputs.findings }}
  report:
    description: "Path to the written report."
    value: ${{ steps.review.outputs.report }}
  status:
    description: "diffmind's exit status: 0 clean, 1 blocking findings, 2 did not run or did not complete."
    value: ${{ steps.review.outputs.status }}

runs:
  using: composite
  steps:
    # The model is ~1.1 GB; without this every run re-downloads it from
    # HuggingFace and takes minutes.
    - name: Cache diffmind model
      uses: actions/cache@v4
      with:
        path: ~/.diffmind/models
        key: diffmind-model-${{ runner.os }}-${{ inputs.model }}

    - name: Install diffmind
      shell: bash
      env:
        DM_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # Validated before it reaches a URL or the installer's environment.
        if [ "$DM_VERSION" = "latest" ]; then
          curl -fsSL https://github.com/thinkgrid-labs/diffmind/releases/latest/download/install.sh | bash
        elif printf '%s' "$DM_VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
          curl -fsSL "https://github.com/thinkgrid-labs/diffmind/releases/download/${DM_VERSION}/install.sh" \
            | VERSION="$DM_VERSION" bash
        else
          echo "::error::invalid version input (expected 'latest' or a release tag such as v0.9.3)"
          exit 2
        fi
        diffmind --version

    - name: Download model
      shell: bash
      env:
        DM_MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail
        case "$DM_MODEL" in
          0.5b|1.5b|3b|7b|14b|32b) ;;
          *) echo "::error::invalid model input"; exit 2 ;;
        esac
        diffmind download --model "$DM_MODEL"

    - name: Run review
      id: review
      shell: bash
      # Inputs travel as environment variables and are validated by the script.
      # Never interpolate `${{ inputs.* }}` into a `run:` block: the expression
      # is pasted into the script source before bash parses it.
      env:
        DM_MODEL: ${{ inputs.model }}
        DM_BASE: ${{ inputs.base }}
        DM_MIN_SEVERITY: ${{ inputs.min-severity }}
        DM_FAIL_ON: ${{ inputs.fail-on }}
        DM_FORMAT: ${{ inputs.format }}
        DM_OUTPUT: ${{ inputs.output }}
        DM_TICKET: ${{ inputs.ticket }}
        DM_ARGS: ${{ inputs.args }}
        DM_ALLOW_INCOMPLETE: ${{ inputs.allow-incomplete }}
        DM_CONFIG_FROM: ${{ inputs.config-from }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action/review.sh"

    # `always()` so a failing gate still publishes the annotations that explain
    # why it failed.
    - name: Upload SARIF
      # Skipped when no report was written (diffmind failed before producing
      # one), so the real error is not buried under "file not found".
      if: always() && inputs.upload-sarif == 'true' && inputs.format == 'sarif' && hashFiles(inputs.output) != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output }}
        category: diffmind

    - name: Job summary
      if: always() && inputs.format == 'markdown'
      shell: bash
      env:
        DM_OUTPUT: ${{ inputs.output }}
      run: |
        if [ -f "$DM_OUTPUT" ]; then
          cat -- "$DM_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Comment on PR
      if: always() && inputs.comment == 'true' && inputs.format == 'markdown' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        DM_OUTPUT: ${{ inputs.output }}
      with:
        script: |
          const fs = require('fs');
          // From the environment, not an inline expression: one inside this
          // script would be pasted into the JavaScript source. (Never write
          // the expression syntax here, even in a comment: GitHub evaluates
          // it anywhere in a `with:` value, and an empty one fails the load.)
          const path = process.env.DM_OUTPUT;
          if (!path || !fs.existsSync(path)) return;
          // GitHub rejects comment bodies over 65,536 characters; a large
          // review must still post, truncated, rather than fail the step.
          const LIMIT = 60000;
          let body = fs.readFileSync(path, 'utf8');
          if (body.length > LIMIT) {
            body = body.slice(0, LIMIT) + '\n\n_Report truncated; see the job summary or the uploaded report for the rest._\n';
          }
          const marker = '<!-- diffmind-review -->';

          // Update the existing comment instead of adding one per push.
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(
            (c) => c.user.type === 'Bot' && c.body.includes(marker)
          );

          const payload = `${marker}\n${body}`;
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: payload,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: payload,
            });
          }
