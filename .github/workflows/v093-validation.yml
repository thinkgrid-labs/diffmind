# TEMPORARY v0.9.3 pre-release validation. Lives only on validation/v0.9.3-*
# branches; never merge. See validation-fixture/README.md.
name: v0.9.3 validation

on:
  push:
    branches: ["validation/v0.9.3-base"]
  pull_request:
    branches: ["validation/v0.9.3-base"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Tests executed on the platforms ci.yml only cross-builds for ──────────
  platform-tests:
    if: github.event_name == 'push'
    name: Tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, label: linux-arm64 }
          - { os: macos-15-intel, label: macos-x86_64 }
          - { os: windows-latest, label: windows-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Environment
        shell: bash
        run: |
          uname -a; rustc -vV; cargo -V; git rev-parse HEAD; git --version; bash --version | head -1
      - name: Windows refused-connect timing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($i in 1..3) {
            $t = Measure-Command { try { $c = New-Object Net.Sockets.TcpClient; $c.Connect('127.0.0.1', 1) } catch {} }
            "connect to a closed loopback port: $([int]$t.TotalMilliseconds) ms"
          }
      - name: cargo test (every target, no fail-fast)
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-targets --no-fail-fast 2>&1 | tee test.log
      - name: Test counts
        if: always()
        shell: bash
        run: grep -E 'Running |^test result:' test.log || true
      - name: Action harness
        if: runner.os != 'Windows'
        run: bash scripts/action/test-review.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log-${{ matrix.label }}
          path: test.log

  # ─── Real 1.5B model end to end, per platform ──────────────────────────────
  e2e:
    if: github.event_name == 'push'
    name: E2E real model (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x86_64 }
          - { os: ubuntu-24.04-arm, label: linux-arm64 }
          - { os: ubuntu-latest, label: linux-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-release
      - name: cargo build --release
        shell: bash
        run: cargo build --release
      - name: e2e
        shell: bash
        run: |
          BIN=target/release/diffmind
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          bash validation-fixture/tools/e2e.sh "$PWD/$BIN" 2>&1 | tee e2e.log
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.label }}
          path: |
            e2e.log
            ${{ runner.temp }}/dm-e2e/*.json
            ${{ runner.temp }}/dm-e2e/*.err

  # ─── GitHub Action integration on validation pull requests ─────────────────
  build-cli:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: action-cli
      - run: cargo build --release && sha256sum target/release/diffmind && git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: diffmind-linux-x64
          path: target/release/diffmind

  # The action installs a *released* binary (v0.9.3 does not exist yet), so the
  # branch's binary is put first on PATH; the install step still runs.
  action:
    needs: build-cli
    name: Action (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: sarif-upload, cli: branch, format: sarif, output: diffmind.sarif, upload: "true", comment: "false", args: "", cfrom: base, pr: any }
          - { name: markdown-comment, cli: branch, format: markdown, output: diffmind.md, upload: "false", comment: "true", args: "", cfrom: base, pr: pr-blocking }
          - { name: backend-failure, cli: branch, format: sarif, output: diffmind.sarif, upload: "false", comment: "false", args: "--backend openai-compatible --backend-url http://127.0.0.1:9 --backend-model x", cfrom: base, pr: pr-blocking }
          - { name: incomplete, cli: branch, format: sarif, output: diffmind.sarif, upload: "false", comment: "false", args: "--max-tokens 32000", cfrom: base, pr: pr-blocking }
          - { name: released-v0.9.2-cli, cli: release, format: sarif, output: diffmind.sarif, upload: "false", comment: "false", args: "", cfrom: base, pr: pr-blocking }
          - { name: config-from-head, cli: branch, format: sarif, output: diffmind.sarif, upload: "false", comment: "false", args: "", cfrom: head, pr: pr-config-bypass }
    steps:
      - name: Applies to this PR?
        id: gate
        env:
          HEAD_REF: ${{ github.head_ref }}
          WANT: ${{ matrix.pr }}
        run: |
          if [ "$WANT" = any ] || [ "$HEAD_REF" = "validation/v0.9.3-$WANT" ]; then echo run=true >>"$GITHUB_OUTPUT"; else echo run=false >>"$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.run == 'true' && matrix.cli == 'branch'
        with:
          name: diffmind-linux-x64
          path: ${{ runner.temp }}/dmbin
      - name: Put the branch binary first on PATH
        if: steps.gate.outputs.run == 'true' && matrix.cli == 'branch'
        run: |
          chmod +x "$RUNNER_TEMP/dmbin/diffmind"
          echo "$RUNNER_TEMP/dmbin" >>"$GITHUB_PATH"
      - name: Run the action
        id: dm
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        uses: ./
        with:
          format: ${{ matrix.format }}
          output: ${{ matrix.output }}
          upload-sarif: ${{ matrix.upload }}
          comment: ${{ matrix.comment }}
          args: ${{ matrix.args }}
          config-from: ${{ matrix.cfrom }}
      - name: Record
        if: always() && steps.gate.outputs.run == 'true'
        env:
          OUT_STATUS: ${{ steps.dm.outputs.status }}
          OUT_FINDINGS: ${{ steps.dm.outputs.findings }}
          OUT_REPORT: ${{ steps.dm.outputs.report }}
          OUTCOME: ${{ steps.dm.outcome }}
          REPORT: ${{ matrix.output }}
        run: |
          echo "outcome=$OUTCOME status=$OUT_STATUS findings=$OUT_FINDINGS report=$OUT_REPORT"
          echo "diffmind on PATH: $(command -v diffmind)"; which -a diffmind || true
          sha256sum "$(command -v diffmind)"
          echo "supports --require-complete: $(diffmind --help | grep -c -- --require-complete)"
          git log --oneline -3
          if [ -f "$REPORT" ]; then
            python3 -I - "$REPORT" <<'PY' || head -c 4000 "$REPORT"
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          run = d["runs"][0]
          drv = run["tool"]["driver"]
          print("tool", drv.get("name"), drv.get("version"), "rules", len(drv.get("rules", [])))
          inv = (run.get("invocations") or [{}])[0]
          print("executionSuccessful", inv.get("executionSuccessful"))
          print("notifications", [n.get("message", {}).get("text") for n in inv.get("toolExecutionNotifications", [])][:5])
          print("completeness", json.dumps(run.get("properties", {}).get("completeness")))
          for r in run.get("results", []):
              loc = r["locations"][0]["physicalLocation"]
              print("result", r.get("ruleId"), r.get("level"), loc["artifactLocation"]["uri"], loc.get("region", {}).get("startLine"))
          PY
          else
            echo "no report written"
          fi
          printf '%s\n' "{\"scenario\":\"${{ matrix.name }}\",\"outcome\":\"$OUTCOME\",\"status\":\"$OUT_STATUS\",\"findings\":\"$OUT_FINDINGS\"}" >record.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: action-${{ matrix.name }}
          path: |
            record.json
            ${{ matrix.output }}

  # Same SARIF upload, but the job's token has no security-events permission.
  action-no-write-permission:
    needs: build-cli
    if: github.head_ref == 'validation/v0.9.3-pr-blocking'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: diffmind-linux-x64
          path: ${{ runner.temp }}/dmbin
      - run: |
          chmod +x "$RUNNER_TEMP/dmbin/diffmind"
          echo "$RUNNER_TEMP/dmbin" >>"$GITHUB_PATH"
      - name: Run the action
        id: dm
        continue-on-error: true
        uses: ./
      - name: Record
        if: always()
        env:
          OUT_STATUS: ${{ steps.dm.outputs.status }}
          OUT_FINDINGS: ${{ steps.dm.outputs.findings }}
          OUTCOME: ${{ steps.dm.outcome }}
        run: echo "outcome=$OUTCOME status=$OUT_STATUS findings=$OUT_FINDINGS"
