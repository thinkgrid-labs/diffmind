<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">How Diffmind reviews a change</title>
<desc id="d">A git diff is parsed and filtered. The remaining hunks go two ways: fixed rules (DM001, DM002 and your regex rules) run without a model, and the code graph adds the enclosing function, callers, definitions and tests before the selected model reviews each unit. Both results are matched to changed lines, suppressions and the baseline are applied, and Diffmind writes a text, JSON, SARIF or Markdown report with exit code 0, 1 or 2.</desc>
<style>
.bx{fill:#f6f8fa;stroke:#d0d7de}.ac{fill:#ddf4ff;stroke:#54aeff}.h{fill:#1f2328;font-size:14px;font-weight:600}.s{fill:#59636e;font-size:11.5px}.ln{stroke:#8c959f;stroke-width:1.5;fill:none}.ar{fill:#8c959f}
@media (prefers-color-scheme:dark){.bx{fill:#161b22;stroke:#3d444d}.ac{fill:#0c2d4a;stroke:#1f6feb}.h{fill:#f0f6fc}.s{fill:#9198a1}.ln{stroke:#656c76}.ar{fill:#656c76}}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="ar" d="M0 0L8 4L0 8z"/></marker></defs>
<rect class="bx" x="8" y="84" width="122" height="68" rx="8"/>
<text class="h" x="69" y="112" text-anchor="middle">Git diff</text>
<text class="s" x="69" y="131" text-anchor="middle">branch · range</text>
<text class="s" x="69" y="145" text-anchor="middle">staged · stdin</text>
<rect class="bx" x="160" y="84" width="130" height="68" rx="8"/>
<text class="h" x="225" y="112" text-anchor="middle">Filter</text>
<text class="s" x="225" y="131" text-anchor="middle">lockfiles, generated,</text>
<text class="s" x="225" y="145" text-anchor="middle">docs, whitespace</text>
<rect class="bx" x="330" y="12" width="300" height="60" rx="8"/>
<text class="h" x="480" y="37" text-anchor="middle">Fixed rules — no model</text>
<text class="s" x="480" y="56" text-anchor="middle">DM001 · DM002 · your regex rules</text>
<rect class="ac" x="330" y="120" width="140" height="100" rx="8"/>
<text class="h" x="400" y="146" text-anchor="middle">Code graph</text>
<text class="s" x="400" y="166" text-anchor="middle">enclosing function</text>
<text class="s" x="400" y="181" text-anchor="middle">callers · definitions</text>
<text class="s" x="400" y="196" text-anchor="middle">test file</text>
<rect class="bx" x="490" y="120" width="140" height="100" rx="8"/>
<text class="h" x="560" y="146" text-anchor="middle">Model</text>
<text class="s" x="560" y="166" text-anchor="middle">local (default)</text>
<text class="s" x="560" y="181" text-anchor="middle">Ollama</text>
<text class="s" x="560" y="196" text-anchor="middle">OpenAI-compatible</text>
<rect class="bx" x="670" y="74" width="202" height="88" rx="8"/>
<text class="h" x="771" y="100" text-anchor="middle">Findings + gate</text>
<text class="s" x="771" y="119" text-anchor="middle">suppressions · baseline</text>
<text class="s" x="771" y="134" text-anchor="middle">text · JSON · SARIF · Markdown</text>
<text class="s" x="771" y="149" text-anchor="middle">exit 0 / 1 / 2</text>
<path class="ln" marker-end="url(#a)" d="M130 118H158"/>
<path class="ln" marker-end="url(#a)" d="M290 108C310 108 306 42 328 42"/>
<path class="ln" marker-end="url(#a)" d="M290 128C310 128 306 170 328 170"/>
<path class="ln" marker-end="url(#a)" d="M470 170H488"/>
<path class="ln" marker-end="url(#a)" d="M630 42C652 42 648 100 668 100"/>
